<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dungeon · Forum</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .card, .pill, .btn, .empty and the page chrome come from
   /dungeon.css. The category card is the only page-specific piece. */
.cat{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;
  transition:border-color .18s,transform .14s}
.cat:hover{border-color:var(--line2);transform:translateY(-1px)}
.cat-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat-top h2{font-size:16.5px;font-weight:600;letter-spacing:-.014em}
.cat-desc{font-size:13.5px;line-height:1.6;color:var(--muted);margin-top:6px;max-width:60ch;text-wrap:pretty}
.cat-stats{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.cat-stats b{color:var(--text2);font-weight:600}
.cat-last{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.6;color:var(--faint)}
.cat-last b{color:var(--text2);font-weight:500}

@media(min-width:880px){
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-xl row">
    <a href="/dashboard.html" class="brand" id="logoLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/messages.html" class="has-badge">Messages<span class="count-badge" id="msgCount">0</span></a>
      <button type="button" onclick="signOut()">Sign out</button>
    </nav>
  </div>
</header>

<main class="page" data-requires-auth>
  <div class="wrap wrap-xl">

    <div class="page-head head-split">
      <div>
        <h1 class="title-lg">Forum</h1>
        <p class="page-sub">Where the Dungeon talks to itself.</p>
      </div>
      <a href="/new-thread.html" class="btn btn-primary btn-sm">New thread</a>
    </div>

    <div id="categoryList"><div class="loading"><span class="spin" aria-hidden="true"></span>Loading the forum…</div></div>

  </div>
</main>

<footer>
  <div class="wrap wrap-xl foot">
    <div class="spread">
      <span>© 2026 Dungeon</span>
      <nav id="footNav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/guides.html">Guides</a>
        <a href="/forum.html">Forum</a>
        <a href="/support.html">Support</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/dungeon-nav.js" defer></script>
<script>
  (async function(){
    const d = await (window.dungeonMe || fetch('/api/member/me').then(r=>r.json()).catch(()=>({})));
    if(!d.authenticated){window.location.href='/login.html';return}
    loadCategories();
  })();

  async function loadCategories(){
    const cats = await fetch('/api/forum/categories').then(r=>r.json()).catch(()=>[]);
    const el = document.getElementById('categoryList');
    if(!Array.isArray(cats) || !cats.length){
      el.innerHTML = '<div class="card"><div class="empty">No categories yet.</div></div>';
      return;
    }
    el.className = 'cats cards';
    el.innerHTML = cats.map(c => {
      const last = c.last_thread;
      return `<a class="cat" href="/threads.html?cat=${encodeURIComponent(c.id)}">
        <div class="cat-top">
          <h2>${esc(c.name)}</h2>
          ${c.restricted ? '<span class="pill pill-mute">Dungeon Master only</span>' : ''}
        </div>
        ${c.description ? `<p class="cat-desc">${esc(c.description)}</p>` : ''}
        <div class="cat-stats">
          <span><b>${c.thread_count}</b> threads</span>
          <span><b>${c.post_count}</b> posts</span>
        </div>
        ${last ? `<div class="cat-last">Last: <b>${esc(last.title)}</b> by @${esc(last.screen_name)} · ${timeAgo(last.last_post_at)}</div>` : ''}
      </a>`;
    }).join('');
  }

  function timeAgo(dt){
    if(!dt) return '';
    if(!dt.endsWith('Z') && !dt.includes('+')) dt = dt.replace(' ','T') + 'Z';
    const s=Math.floor((Date.now()-new Date(dt))/1000);
    if(s<60)return 'just now';
    if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago';
    if(s<604800)return Math.floor(s/86400)+'d ago';
    return new Date(dt).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }

  // Category names, titles and usernames are member-supplied, so they are
  // escaped before going anywhere near innerHTML.
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
