<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dungeon · Thread</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .card, .avatar, .pill, .field, .btn, .notice and the page chrome come
   from /dungeon.css. */
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.crumb a{color:var(--muted);transition:color .18s}
.crumb a:hover{color:var(--accent)}

.thread-head{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.thread-head h1{font-size:clamp(22px,3.4vw,29px);line-height:1.16;font-weight:600;letter-spacing:-.026em;text-wrap:balance}
.thread-head .flags{display:flex;gap:6px;margin-bottom:10px}
.thread-head .flags:empty{display:none}
.thread-meta{font-size:13px;color:var(--muted);margin-top:10px}
.thread-meta a{color:var(--text2)}
.thread-meta a:hover{color:var(--accent)}
.mod-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* One post. The avatar column keeps every reply on the same left edge,
   which is what makes a long thread readable. */
.post{display:flex;gap:14px;padding-block:22px;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:none}
.post .avatar{width:34px;height:34px;font-size:13px}
.post-body{min-width:0;flex:1}
.post-author{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.post-author .name{font-size:14px;font-weight:600;color:var(--text)}
.post-author .name:hover{color:var(--accent)}
.post-time{font-family:var(--mono);font-size:11px;color:var(--faint)}
.post-content{font-size:14.5px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-wrap:break-word;text-wrap:pretty}
.post-actions{margin-top:12px}
.post-actions button{background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans);
  font-size:12px;color:var(--faint);transition:color .18s}
.post-actions button:hover{color:var(--red)}

.reply{margin-top:26px}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-md row">
    <a href="/dashboard.html" class="brand" id="logoLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/forum.html">Forum</a>
      <a href="/messages.html" class="has-badge">Messages<span class="count-badge" id="msgCount">0</span></a>
    </nav>
  </div>
</header>

<main class="page" data-requires-auth>
  <div class="wrap wrap-md">
    <div class="crumb" id="breadcrumb"><a href="/forum.html">Forum</a> › …</div>
    <div id="threadHeader"></div>
    <div id="postList"><div class="loading"><span class="spin" aria-hidden="true"></span>Loading the thread…</div></div>
    <div id="replyArea"></div>
  </div>
</main>

<footer>
  <div class="wrap wrap-md foot">
    <div class="spread">
      <span>© 2026 Dungeon</span>
      <nav id="footNav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/guides.html">Guides</a>
        <a href="/forum.html">Forum</a>
        <a href="/support.html">Support</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/dungeon-nav.js" defer></script>
<script>
  const threadId = new URLSearchParams(window.location.search).get('id');
  if(!threadId) window.location.href='/forum.html';

  const TIERS={neut:{label:'Neut',color:'#E2E8E4'},member:{label:'Member',color:'#60A5FA'},
    family:{label:'Family',color:'#A78BFA'},dealer:{label:'Dealer',color:'#F59E0B'},
    mod:{label:'Moderator',color:'#34D399'},admin:{label:'Admin',color:'#F87171'},
    warden:{label:'Dungeon Master',color:'#FBBF24'}};

  let myProfile = null;
  let threadData = null;

  (async function(){
    const d = await (window.dungeonMe || fetch('/api/member/me').then(r=>r.json()).catch(()=>({})));
    if(!d.authenticated){window.location.href='/login.html';return}
    myProfile = d.member?.profile;
    loadThread();
  })();

  async function loadThread(){
    const res = await fetch('/api/forum/threads/'+encodeURIComponent(threadId));
    if(!res.ok){window.location.href='/forum.html';return}
    const data = await res.json();
    threadData = data.thread;
    document.title = 'Dungeon · ' + threadData.title;
    renderHeader(threadData);
    renderPosts(data.posts||[]);
    renderReplyBox(threadData);
  }

  function isMod(){ return myProfile && ['mod','admin','warden'].includes(myProfile.tier); }

  function renderHeader(t){
    document.getElementById('breadcrumb').innerHTML =
      `<a href="/forum.html">Forum</a> › <a href="/threads.html?cat=${encodeURIComponent(t.category_id)}">${esc(t.category_name)}</a>`;

    const modBar = isMod() ? `
      <div class="mod-bar">
        <button class="btn btn-ghost btn-sm" onclick="togglePin()">${t.pinned?'Unpin':'Pin'}</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleLock()">${t.locked?'Unlock':'Lock'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteThread()">Delete thread</button>
      </div>` : '';

    document.getElementById('threadHeader').innerHTML = `
      <div class="thread-head">
        <div class="flags">
          ${t.pinned?'<span class="pill pill-info">Pinned</span>':''}
          ${t.locked?'<span class="pill pill-mute">Locked</span>':''}
        </div>
        <h1>${esc(t.title)}</h1>
        <p class="thread-meta">
          <a href="/profile.html?id=${encodeURIComponent(t.profile_id)}">@${esc(t.screen_name)}</a>
          · ${timeAgo(t.created_at)} · ${t.post_count} post${t.post_count===1?'':'s'}
        </p>
        ${modBar}
      </div>`;
  }

  function renderPosts(posts){
    document.getElementById('postList').innerHTML = posts.map((p,i) => {
      const tier = TIERS[p.tier]||{label:p.tier||'Member',color:'#E2E8E4'};
      const isOwn = myProfile && myProfile.id === p.profile_id;
      const initials = p.screen_name ? p.screen_name[0].toUpperCase() : '?';
      return `<article class="post" id="post-${p.id}">
        <span class="avatar" style="background:${esc(p.avatar_color||'#60A5FA')}">
          ${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt=""/>`:esc(initials)}
        </span>
        <div class="post-body">
          <div class="post-author">
            <a href="/profile.html?id=${encodeURIComponent(p.profile_id)}" class="name">@${esc(p.screen_name)}</a>
            <span class="pill" style="background:${tier.color}1A;border:1px solid ${tier.color}44;color:${tier.color}">${esc(tier.label)}</span>
            ${i===0?'<span class="pill pill-ok">OP</span>':''}
            <span class="post-time">${timeAgo(p.created_at)}${p.edited_at?' · edited':''}</span>
          </div>
          <div class="post-content">${esc(p.content)}</div>
          ${(isOwn||isMod())?`<div class="post-actions"><button onclick="deletePost('${p.id}')">Delete</button></div>`:''}
        </div>
      </article>`;
    }).join('');
  }

  function renderReplyBox(t){
    const area = document.getElementById('replyArea');
    if(!myProfile){area.innerHTML='';return}
    if(t.locked){
      area.innerHTML='<div class="notice reply">This thread is locked. No new replies.</div>';
      return;
    }
    if(myProfile.tier==='neut'){
      area.innerHTML='<div class="notice reply">Your application is still pending. You can read, but not reply yet.</div>';
      return;
    }
    area.innerHTML=`
      <div class="card reply">
        <div class="card-title">Reply</div>
        <div class="banner banner-err" id="replyErr"></div>
        <div class="field">
          <textarea id="replyContent" rows="5" placeholder="Write your reply."></textarea>
          <div class="hint">Plain text. Keep it civil.</div>
        </div>
        <button class="btn btn-primary btn-wide" id="replyBtn" onclick="submitReply()">Post reply</button>
      </div>`;
  }

  async function submitReply(){
    const content = document.getElementById('replyContent').value.trim();
    const btn = document.getElementById('replyBtn');
    const err = document.getElementById('replyErr');
    if(!content){err.textContent='Write something first.';err.style.display='block';return}
    btn.disabled=true;btn.textContent='Posting…';err.style.display='none';

    const res = await fetch('/api/forum/threads/'+encodeURIComponent(threadId)+'/posts',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
    const data = await res.json();
    if(res.ok){
      await loadThread();
      // The new reply is at the bottom, so go to it.
      setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),150);
    } else {
      err.textContent=data.error||'Something went wrong.';err.style.display='block';
      btn.disabled=false;btn.textContent='Post reply';
    }
  }

  async function deletePost(id){
    if(!confirm('Delete this post?'))return;
    await fetch('/api/forum/posts/'+encodeURIComponent(id),{method:'DELETE'});
    document.getElementById('post-'+id).remove();
  }

  async function togglePin(){
    await fetch('/api/forum/threads/'+encodeURIComponent(threadId),
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pinned:!threadData.pinned})});
    loadThread();
  }

  async function toggleLock(){
    await fetch('/api/forum/threads/'+encodeURIComponent(threadId),
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({locked:!threadData.locked})});
    loadThread();
  }

  async function deleteThread(){
    if(!confirm('Delete this thread and every post in it?'))return;
    await fetch('/api/forum/threads/'+encodeURIComponent(threadId),{method:'DELETE'});
    window.location.href='/threads.html?cat='+encodeURIComponent(threadData.category_id);
  }

  // Post bodies, titles, usernames and avatar colours all come from
  // members, so nothing reaches innerHTML unescaped.
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

  function timeAgo(dt){
    // SQLite stores datetimes without a timezone, so force UTC.
    if(!dt) return '';
    if(!dt.endsWith('Z') && !dt.includes('+')) dt = dt.replace(' ','T') + 'Z';
    const s=Math.floor((Date.now()-new Date(dt))/1000);
    if(s<60)return 'just now';
    if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago';
    if(s<604800)return Math.floor(s/86400)+'d ago';
    return new Date(dt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
