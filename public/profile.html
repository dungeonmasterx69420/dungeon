<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dungeon · Profile</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .card, .avatar, .pill, .figure, .btn and the page chrome come from
   /dungeon.css. */
.who{text-align:center;padding-block:10px 4px}
.who .avatar{margin:0 auto 16px}
.who h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.who .tier{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border-radius:20px;padding:4px 12px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em}
.who .tier i{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;font-style:normal}
.who .since{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:14px}
.who .act{margin-top:22px}

.sub-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sub-row .days{text-align:right;flex:none}
.sub-row .days b{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1}
.sub-row .days span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-top:4px}

.col{max-width:440px;margin:0 auto}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-lg row">
    <a href="/dashboard.html" class="brand" id="logoLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/messages.html" class="has-badge">Messages<span class="count-badge" id="msgCount">0</span></a>
      <button type="button" onclick="signOut()">Sign out</button>
    </nav>
  </div>
</header>

<main class="page" data-requires-auth>
  <div class="wrap wrap-lg col">
    <div class="card" id="profileCard">
      <div class="loading"><span class="spin" aria-hidden="true"></span>Loading…</div>
    </div>
    <div id="subCard"></div>
  </div>
</main>

<footer>
  <div class="wrap wrap-lg foot">
    <div class="spread">
      <span>© 2026 Dungeon</span>
      <nav id="footNav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/guides.html">Guides</a>
        <a href="/forum.html">Forum</a>
        <a href="/support.html">Support</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/dungeon-nav.js" defer></script>
<script>
  const TIERS = {
    neut:   { label:'Neut',            color:'#E2E8E4' },
    member: { label:'Member',          color:'#60A5FA' },
    family: { label:'Family pass',     color:'#A78BFA' },
    dealer: { label:'DungeonDealer',   color:'#F59E0B' },
    mod:    { label:'Moderator',       color:'#34D399' },
    admin:  { label:'Admin',           color:'#F87171' },
    warden: { label:'Dungeon Master',  color:'#FBBF24' },
  };

  const params = new URLSearchParams(window.location.search);
  const profileId = params.get('id') || (params.get('sn') ? '@'+params.get('sn') : null);

  (async function(){
    const d = await (window.dungeonMe || fetch('/api/member/me').then(r=>r.json()).catch(()=>({})));
    if (!d.authenticated) { window.location.href='/login.html'; return; }
    loadProfile(d.member);
  })();

  async function loadProfile(me) {
    if (!profileId) {
      // No id in the URL means your own profile.
      if (!me.profile) { window.location.href='/setup.html'; return; }
      renderProfile(me.profile, me);
      return;
    }
    const res = await fetch('/api/profiles/'+encodeURIComponent(profileId));
    if (!res.ok) {
      document.getElementById('profileCard').innerHTML='<div class="empty">No such member.</div>';
      return;
    }
    renderProfile(await res.json(), me);
  }

  function renderProfile(p, me) {
    const tier = TIERS[p.tier] || { label: p.tier || 'Member', color: '#E2E8E4' };
    const initials = p.screen_name ? p.screen_name[0].toUpperCase() : '?';
    const joined = new Date(p.created_at).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
    const isOwn = me.profile && me.profile.id === p.id;

    document.title = 'Dungeon · @' + p.screen_name;

    document.getElementById('profileCard').innerHTML = `
      <div class="who">
        <span class="avatar avatar-lg" style="background:${esc(p.avatar_color||'#60A5FA')}">
          ${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt=""/>` : esc(initials)}
        </span>
        <h1>@${esc(p.screen_name)}</h1>
        <span class="tier" style="color:${tier.color};background:${tier.color}1A"><i></i>${esc(tier.label)}</span>
        <div class="since">Member since ${joined}</div>
        <div class="act">${isOwn
          ? '<a href="/account.html" class="btn btn-ghost btn-sm">Edit your account</a>'
          : `<a href="/messages.html?to=${encodeURIComponent(p.id)}" class="btn btn-primary btn-sm">Send a message</a>`
        }</div>
      </div>`;

    // Your own subscription, on your own profile.
    if (isOwn && me.subscription_end) {
      const end = new Date(me.subscription_end);
      const daysLeft = Math.ceil((end - new Date()) / 86400000);
      const colour = daysLeft <= 0 ? 'var(--red)' : daysLeft <= 5 ? 'var(--amber)' : 'var(--accent)';
      const label  = daysLeft <= 0 ? 'Expired' : daysLeft <= 5 ? 'Expiring soon' : 'Active';
      document.getElementById('subCard').innerHTML = `
        <div class="card mt-2">
          <div class="sub-row">
            <div class="grow">
              <span class="label tight">Subscription</span>
              <b style="font-size:15px;font-weight:600;color:${colour}">${label}</b>
              <div class="figure-sub">Ends ${end.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
            </div>
            <div class="days">
              <b style="color:${colour}">${Math.max(0,daysLeft)}</b>
              <span>${daysLeft === 1 ? 'day left' : 'days left'}</span>
            </div>
          </div>
        </div>`;
    }
  }

  // Usernames and avatar colours are member-supplied.
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
