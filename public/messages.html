<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dungeon · Messages</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .card, .avatar, .tabbar, .field, .btn, .veil, .sheet, .empty and the
   page chrome come from /dungeon.css. */

/* On a phone this is one pane that swaps; from 880 up it is a real two
   pane inbox, because a message and the list of messages are things you
   want at the same time. */
.pane-detail{display:none}
.mail.reading .pane-list{display:none}
.mail.reading .pane-detail{display:block}

.msg-row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 4px;
  border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;
  text-align:left;font:inherit;color:inherit;cursor:pointer;transition:padding-left .16s}
.msg-row:hover{padding-left:8px}
.msg-row:last-child{border-bottom:none}
.msg-row .avatar{width:34px;height:34px;font-size:13px}
.msg-row .txt{min-width:0;flex:1}
/* These are spans so the row can be a button; they need to be blocks for
   the ellipsis to do anything. */
.msg-row .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.msg-row .subject{display:block;font-size:14px;font-weight:500;color:var(--text2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-row .preview{display:block;font-size:12.5px;color:var(--faint);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-row .when{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.msg-row.unread .subject{color:var(--text);font-weight:600}
.msg-row.unread .who::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin-left:7px;vertical-align:middle}

.detail-subject{font-size:19px;font-weight:600;letter-spacing:-.018em;text-wrap:pretty}
.detail-meta{display:flex;align-items:center;gap:11px;margin:14px 0 20px;padding-bottom:18px;
  border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.detail-meta .avatar{width:32px;height:32px;font-size:12px}
.detail-meta a{color:var(--text2)}
.detail-meta a:hover{color:var(--accent)}
.detail-body{font-size:14.5px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-wrap:break-word}
.detail-actions{display:flex;gap:8px;margin-top:26px}

@media(min-width:880px){
  .mail{display:grid;grid-template-columns:344px 1fr;gap:16px;align-items:start}
  .mail .pane-list,.mail.reading .pane-list{display:block}
  .pane-detail{display:block;position:sticky;top:88px}
  .back-row{display:none}
}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-xl row">
    <a href="/dashboard.html" class="brand" id="logoLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/forum.html">Forum</a>
      <button type="button" onclick="signOut()">Sign out</button>
    </nav>
  </div>
</header>

<main class="page" data-requires-auth>
  <div class="wrap wrap-xl">

    <div class="page-head head-split">
      <div>
        <h1 class="title-lg">Messages</h1>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openCompose()">Compose</button>
    </div>

    <div class="mail" id="mail">
      <div class="pane-list" id="msgListView">
        <div class="card">
          <div class="tabbar mb-1">
            <button class="on" id="inboxTab" onclick="switchTab('inbox',this)">Inbox</button>
            <button id="sentTab" onclick="switchTab('sent',this)">Sent</button>
          </div>
          <div id="msgList"><div class="loading"><span class="spin" aria-hidden="true"></span>Loading…</div></div>
        </div>
      </div>

      <div class="pane-detail" id="msgDetail">
        <div class="back-row mb-1">
          <button class="btn btn-ghost btn-sm" onclick="closeDetail()">← All messages</button>
        </div>
        <div class="card" id="detailContent">
          <div class="empty">Pick a message to read it.</div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap wrap-xl foot">
    <div class="spread">
      <span>© 2026 Dungeon</span>
      <nav id="footNav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/guides.html">Guides</a>
        <a href="/forum.html">Forum</a>
        <a href="/support.html">Support</a>
      </nav>
    </div>
  </div>
</footer>

<!-- Compose -->
<div class="veil" id="composeVeil" onclick="if(event.target===this)closeCompose()">
  <div class="sheet">
    <span class="handle"></span>
    <h2>New message</h2>
    <p class="sub">Members only. It lands in their inbox here.</p>

    <div class="banner banner-err" id="composeErr"></div>

    <div class="field">
      <label for="recipientSelect">To</label>
      <select id="recipientSelect"><option value="">Pick a member…</option></select>
    </div>
    <div class="field">
      <label for="msgSubject">Subject</label>
      <input type="text" id="msgSubject" placeholder="What it's about" maxlength="200"/>
    </div>
    <div class="field">
      <label for="msgContent">Message</label>
      <textarea id="msgContent" rows="6" placeholder="Write it out."></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeCompose()">Cancel</button>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="/dungeon-nav.js" defer></script>
<script>
  let myProfile = null;
  let activeTab = 'inbox';
  let allProfiles = [];
  let currentMessages = [];

  // A profile page can link straight into a new message.
  const preRecipient = new URLSearchParams(window.location.search).get('to');

  (async function(){
    const d = await (window.dungeonMe || fetch('/api/member/me').then(r=>r.json()).catch(()=>({})));
    if(!d.authenticated){window.location.href='/login.html';return}
    myProfile = d.member?.profile;
    loadProfiles();
    loadInbox();
  })();

  async function loadProfiles(){
    const profiles = await fetch('/api/profiles').then(r=>r.json()).catch(()=>[]);
    if(!Array.isArray(profiles)) return;
    allProfiles = profiles.filter(p => p.id !== myProfile?.id);
    const sel = document.getElementById('recipientSelect');
    allProfiles.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = '@' + p.screen_name;
      sel.appendChild(opt);
    });
    if(preRecipient){
      sel.value = preRecipient;
      openCompose();
    }
  }

  function switchTab(tab, el){
    activeTab = tab;
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));
    el.classList.add('on');
    closeDetail();
    if(tab==='inbox') loadInbox(); else loadSent();
  }

  async function loadInbox(){
    currentMessages = await fetch('/api/messages').then(r=>r.json()).catch(()=>[]);
    renderMessages(currentMessages, 'inbox');
  }

  async function loadSent(){
    currentMessages = await fetch('/api/messages/sent').then(r=>r.json()).catch(()=>[]);
    renderMessages(currentMessages, 'sent');
  }

  function otherParty(m, sent){
    return sent
      ? {name:m.recipient_name, avatar:m.recipient_avatar, color:m.recipient_color, id:m.recipient_profile_id}
      : {name:m.sender_name,    avatar:m.sender_avatar,    color:m.sender_color,    id:m.sender_profile_id};
  }

  function avatarFor(p){
    const initials = p.name ? p.name[0].toUpperCase() : '?';
    return `<span class="avatar" style="background:${esc(p.color||'#60A5FA')}">${
      p.avatar ? `<img src="${esc(p.avatar)}" alt=""/>` : esc(initials)}</span>`;
  }

  function renderMessages(msgs, tab){
    const el = document.getElementById('msgList');
    if(!Array.isArray(msgs) || !msgs.length){
      el.innerHTML = '<div class="empty">' +
        (tab==='inbox' ? 'Nothing in your inbox yet.' : "You haven't sent anything yet.") + '</div>';
      return;
    }
    const sent = tab === 'sent';
    el.innerHTML = msgs.map(m => {
      const other = otherParty(m, sent);
      return `<button class="msg-row${(!sent && !m.read)?' unread':''}" data-id="${esc(m.id)}" onclick="openMsg('${esc(m.id)}')">
        ${avatarFor(other)}
        <span class="txt">
          <span class="who">${sent?'To':'From'} @${esc(other.name)}</span>
          <span class="subject">${esc(m.subject)}</span>
          <span class="preview">${esc(m.content)}</span>
        </span>
        <span class="when">${timeAgo(m.created_at)}</span>
      </button>`;
    }).join('');
  }

  async function openMsg(id){
    const m = currentMessages.find(x=>String(x.id)===String(id));
    if(!m) return;

    const sent = activeTab === 'sent';

    if(!sent && !m.read){
      await fetch('/api/messages/'+encodeURIComponent(id)+'/read',{method:'PATCH'});
      m.read = 1;
      const row = document.querySelector('.msg-row[data-id="'+CSS.escape(String(id))+'"]');
      if(row) row.classList.remove('unread');
      const badge = document.getElementById('msgCount');
      if(badge){
        const left = (parseInt(badge.textContent,10)||1) - 1;
        if(left > 0) badge.textContent = left; else badge.style.display = 'none';
      }
    }

    const other = otherParty(m, sent);
    document.getElementById('detailContent').innerHTML = `
      <h2 class="detail-subject">${esc(m.subject)}</h2>
      <div class="detail-meta">
        ${avatarFor(other)}
        <span>${sent?'To':'From'} <a href="/profile.html?id=${encodeURIComponent(other.id)}">@${esc(other.name)}</a>
        · ${timeAgo(m.created_at)}</span>
      </div>
      <div class="detail-body">${esc(m.content)}</div>
      <div class="detail-actions">
        ${sent?'':`<button class="btn btn-ghost btn-sm" onclick="replyTo('${esc(other.id)}',this.dataset.subject)" data-subject="${esc(m.subject)}">Reply</button>`}
        <button class="btn btn-danger btn-sm" onclick="deleteMsg('${esc(m.id)}')">Delete</button>
      </div>`;

    document.getElementById('mail').classList.add('reading');
    window.scrollTo(0,0);
  }

  function closeDetail(){
    document.getElementById('mail').classList.remove('reading');
    document.getElementById('detailContent').innerHTML = '<div class="empty">Pick a message to read it.</div>';
  }

  function replyTo(recipientId, subject){
    const sel = document.getElementById('recipientSelect');
    sel.value = recipientId;
    document.getElementById('msgSubject').value = subject.startsWith('Re: ') ? subject : 'Re: ' + subject;
    closeDetail();
    openCompose();
  }

  async function deleteMsg(id){
    if(!confirm('Delete this message?')) return;
    await fetch('/api/messages/'+encodeURIComponent(id),{method:'DELETE'});
    closeDetail();
    if(activeTab==='inbox') loadInbox(); else loadSent();
  }

  // ── Compose ────────────────────────────────────────────────────────────────
  function openCompose(){
    document.getElementById('composeErr').style.display='none';
    document.getElementById('composeVeil').classList.add('open');
  }

  function closeCompose(){
    document.getElementById('composeVeil').classList.remove('open');
    document.getElementById('msgSubject').value='';
    document.getElementById('msgContent').value='';
    if(!preRecipient) document.getElementById('recipientSelect').value='';
  }

  async function sendMessage(){
    const recipient_id = document.getElementById('recipientSelect').value;
    const subject  = document.getElementById('msgSubject').value.trim();
    const content  = document.getElementById('msgContent').value.trim();
    const btn = document.getElementById('sendBtn');
    const err = document.getElementById('composeErr');

    if(!recipient_id||!subject||!content){
      err.textContent='Pick a recipient, and fill in the subject and message.';
      err.style.display='block';
      return;
    }
    btn.disabled=true;btn.textContent='Sending…';err.style.display='none';

    const res = await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({recipient_id,subject,content})});
    const data = await res.json();
    if(res.ok){
      closeCompose();
      if(activeTab==='sent') loadSent(); else loadInbox();
    } else {
      err.textContent=data.error||'Something went wrong.';err.style.display='block';
    }
    btn.disabled=false;btn.textContent='Send';
  }

  function timeAgo(dt){
    if(!dt) return '';
    if(!dt.endsWith('Z')&&!dt.includes('+'))dt=dt.replace(' ','T')+'Z';
    const s=Math.floor((Date.now()-new Date(dt))/1000);
    if(s<60)return 'now';
    if(s<3600)return Math.floor(s/60)+'m';
    if(s<86400)return Math.floor(s/3600)+'h';
    if(s<604800)return Math.floor(s/86400)+'d';
    return new Date(dt).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }

  // Subjects, bodies, usernames and avatar colours are member-supplied.
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
