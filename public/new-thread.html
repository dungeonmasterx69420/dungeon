<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dungeon · New thread</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .field, .card, .banner, .btn-row and the page chrome come from
   /dungeon.css. */
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.crumb a{color:var(--muted);transition:color .18s}
.crumb a:hover{color:var(--accent)}

/* The count only matters as you approach the limit, so it stays quiet
   until then. */
.count{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;margin-top:6px}
.count.over{color:var(--amber)}

.form{max-width:640px}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-lg row">
    <a href="/dashboard.html" class="brand" id="logoLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/forum.html">Forum</a>
      <a href="/messages.html" class="has-badge">Messages<span class="count-badge" id="msgCount">0</span></a>
    </nav>
  </div>
</header>

<main class="page" data-requires-auth>
  <div class="wrap wrap-lg form">

    <div class="crumb"><a href="/forum.html">Forum</a> › New thread</div>
    <div class="page-head">
      <h1 class="page-title">Start a thread</h1>
    </div>

    <div class="banner banner-err" id="errorBanner"></div>

    <div class="card">
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="">Pick one…</option>
        </select>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Say it in a line" maxlength="200" oninput="updateCharCount()"/>
        <div class="count" id="charCount">0 / 200</div>
      </div>

      <div class="field">
        <label for="content">Post</label>
        <textarea id="content" rows="10" placeholder="Write it out."></textarea>
        <div class="hint">Plain text. Keep it civil and on topic.</div>
      </div>

      <div class="btn-row">
        <a href="/forum.html" class="btn btn-ghost">Cancel</a>
        <button class="btn btn-primary" id="submitBtn" onclick="submitThread()">Post thread</button>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap wrap-lg foot">
    <div class="spread">
      <span>© 2026 Dungeon</span>
      <nav id="footNav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/guides.html">Guides</a>
        <a href="/forum.html">Forum</a>
        <a href="/support.html">Support</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/dungeon-nav.js" defer></script>
<script>
  const preCat = new URLSearchParams(window.location.search).get('cat');
  let myProfile = null;

  (async function(){
    const d = await (window.dungeonMe || fetch('/api/member/me').then(r=>r.json()).catch(()=>({})));
    if(!d.authenticated){window.location.href='/login.html';return}
    myProfile = d.member?.profile;
    if(myProfile?.tier==='neut'){
      const banner = document.getElementById('errorBanner');
      banner.textContent='Your application is still pending, so you cannot post yet.';
      banner.style.display='block';
      document.getElementById('submitBtn').disabled=true;
    }
    loadCategories();
  })();

  async function loadCategories(){
    const cats = await fetch('/api/forum/categories').then(r=>r.json()).catch(()=>[]);
    const sel = document.getElementById('category');
    if(!Array.isArray(cats)) return;
    cats.forEach(c=>{
      // Restricted categories are staff-only.
      if(c.restricted && myProfile && !['warden','admin'].includes(myProfile.tier)) return;
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      if(c.id===preCat) opt.selected=true;
      sel.appendChild(opt);
    });
  }

  function updateCharCount(){
    const len = document.getElementById('title').value.length;
    const el = document.getElementById('charCount');
    el.textContent = len + ' / 200';
    el.classList.toggle('over', len>=180);
  }

  async function submitThread(){
    const category_id = document.getElementById('category').value;
    const title   = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const btn = document.getElementById('submitBtn');
    const banner = document.getElementById('errorBanner');

    if(!category_id||!title||!content){
      banner.textContent='Pick a category, and fill in the title and the post.';
      banner.style.display='block';
      window.scrollTo(0,0);
      return;
    }
    btn.disabled=true;btn.textContent='Posting…';banner.style.display='none';

    const res = await fetch('/api/forum/threads',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({category_id,title,content}),
    });
    const data = await res.json();
    if(res.ok){
      window.location.href='/thread.html?id='+data.thread_id;
    } else {
      banner.textContent=data.error||'Something went wrong.';
      banner.style.display='block';
      btn.disabled=false;btn.textContent='Post thread';
      window.scrollTo(0,0);
    }
  }
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
