<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Dungeon · Dealer payouts</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .card, .figure, .pill, table.dt, .btn and the page chrome come from
   /dungeon.css. */
.stats{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:26px}

/* One dealer, collapsed to a line until you open them. The money owed
   is the only figure that needs to be readable at a glance. */
.dealer{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dealer+.dealer{margin-top:10px}
.dealer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  width:100%;padding:16px 18px;background:none;border:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.dealer-head:hover{background:rgba(255,255,255,.02)}
.dealer-head b{display:block;font-size:14.5px;font-weight:600}
.dealer-head em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint)}
.owed{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--amber);text-align:right;line-height:1.2}
.owed.zero{color:var(--faint)}
.chev{color:var(--faint);font-size:11px;transition:transform .2s;flex:none}
.dealer.open .chev{transform:rotate(180deg)}
.dealer-body{display:none;border-top:1px solid var(--line);padding:6px 18px 16px}
.dealer.open .dealer-body{display:block}

.pay-all{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.22);border-radius:11px;
  padding:12px 14px;margin:14px 0;font-size:13px;color:var(--text2)}

@media(min-width:720px){
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-xl row">
    <a href="/admin.html" class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/admin.html">← Admin</a>
      <button type="button" onclick="signOut()">Sign out</button>
    </nav>
  </div>
</header>

<main class="page">
  <div class="wrap wrap-xl">

    <div class="page-head">
      <h1 class="page-title">Dealer payouts</h1>
      <p class="page-sub">Commission owed and paid, by dealer.</p>
    </div>

    <div class="stats">
      <div class="card">
        <span class="label tight">Owed</span>
        <div class="figure"><b id="st-owed" style="color:var(--amber)">—</b></div>
      </div>
      <div class="card">
        <span class="label tight">Paid out</span>
        <div class="figure"><b id="st-paid" style="color:var(--accent)">—</b></div>
      </div>
      <div class="card">
        <span class="label tight">Active dealers</span>
        <div class="figure"><b id="st-dealers">—</b></div>
      </div>
    </div>

    <div id="dealer-list"><div class="loading"><span class="spin" aria-hidden="true"></span>Loading payouts…</div></div>

  </div>
</main>

<script src="/dungeon-nav.js" defer></script>
<script>
const $ = id => document.getElementById(id);

fetch('/api/member/me').then(r=>r.json()).then(d=>{
  if(!d.authenticated){window.location.href='/login.html';return;}
  if(!['admin','warden'].includes(d.member?.profile?.tier)){window.location.href='/dashboard.html';return;}
  load();
});

const money = cents => '$' + (cents/100).toFixed(2);

async function load(){
  const dealers = await fetch('/api/admin/payouts').then(r=>r.json()).catch(()=>[]);
  $('st-owed').textContent    = money(dealers.reduce((s,d)=>s+d.owed,0));
  $('st-paid').textContent    = money(dealers.reduce((s,d)=>s+d.paidOut,0));
  $('st-dealers').textContent = dealers.length;

  const el = $('dealer-list');
  el.innerHTML = dealers.length
    ? dealers.map(buildDealer).join('')
    : '<div class="card"><div class="empty">No dealer activity yet.</div></div>';
}

function buildDealer(d){
  const earned  = d.earnings.filter(e => e.status === 'earned');
  const paidOut = d.earnings.filter(e => e.status === 'paid_out');

  const rows = d.earnings.filter(e => e.status === 'earned' || e.status === 'paid_out').map(e => {
    const isPaid = e.status === 'paid_out';
    return `<tr>
      <td>${esc(e.invite_email||'—')}</td>
      <td class="num">${money(e.invite_amount)}</td>
      <td class="num" style="color:${isPaid?'var(--accent)':'var(--amber)'}">${money(e.dealer_cut)}</td>
      <td class="num">${fmtDate(e.invite_paid_at||e.created_at)}</td>
      <td><span class="pill ${isPaid?'pill-ok':'pill-warn'}"><i></i>${isPaid?'Paid':'Owed'}</span></td>
      <td>${isPaid?'':`<button class="btn btn-ghost btn-sm" onclick="markPaid('${e.id}')">Mark paid</button>`}</td>
    </tr>`;
  }).join('');

  return `<div class="dealer" id="dc-${d.id}">
    <button class="dealer-head" onclick="toggleDealer('${d.id}')" aria-expanded="false">
      <span>
        <b>@${esc(d.screen_name||'unknown')}</b>
        <em>${d.totalSales} sale${d.totalSales!==1?'s':''} · ${earned.length} owed · ${paidOut.length} paid</em>
      </span>
      <span class="flex gap-2">
        <span>
          <span class="owed ${d.owed===0?'zero':''}">${money(d.owed)}</span>
        </span>
        <span class="chev" aria-hidden="true">▼</span>
      </span>
    </button>
    <div class="dealer-body">
      ${d.owed > 0 ? `<div class="pay-all">
        <span>Settle all ${earned.length} unpaid commission${earned.length!==1?'s':''} for @${esc(d.screen_name)}.</span>
        <button class="btn btn-primary btn-sm" onclick="payAll('${d.id}','${esc(d.screen_name)}',${d.owed})">Pay ${money(d.owed)}</button>
      </div>` : ''}
      <div class="table-scroll">
        <table class="dt">
          <thead><tr><th>Client</th><th>Sale</th><th>Cut</th><th>Date</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows||'<tr><td colspan="6"><div class="empty">No completed sales yet.</div></td></tr>'}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function toggleDealer(id){
  const el = document.getElementById('dc-'+id);
  const open = el.classList.toggle('open');
  el.querySelector('.dealer-head').setAttribute('aria-expanded', open);
}

async function markPaid(earningId){
  if(!confirm('Mark this commission as paid out?'))return;
  await fetch('/api/admin/payouts/'+earningId+'/mark-paid',{method:'POST'});
  load();
}

async function payAll(profileId, name, amount){
  if(!confirm('Mark every owed commission as paid out to @'+name+' ('+money(amount)+')?'))return;
  await fetch('/api/admin/payouts/dealer/'+profileId+'/pay-all',{method:'POST'});
  load();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d)return'—';const dt=new Date(d);return isNaN(dt)?'—':dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
