<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#050807"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dungeon · Threads</title>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/dungeon.css"/>
<style>
/* .rows, .row-item, .pill, .btn, .empty and the page chrome come from
   /dungeon.css. */
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.crumb a{color:var(--muted);transition:color .18s}
.crumb a:hover{color:var(--accent)}

.thread .row-main b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:normal}
.thread .flags{display:flex;gap:6px;margin-bottom:6px}
.thread .flags:empty{display:none}
.thread-end{text-align:right;flex:none}
.thread-end b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1}
.thread-end span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.thread-end em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:6px}
</style>
</head>
<body>

<header class="topbar sticky">
  <div class="wrap wrap-lg row">
    <a href="/dashboard.html" class="brand" id="logoLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/></svg>
      <span>DUNGEON</span>
    </a>
    <nav class="topnav">
      <a href="/forum.html">Forum</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/messages.html" class="has-badge">Messages<span class="count-badge" id="msgCount">0</span></a>
    </nav>
  </div>
</header>

<main class="page" data-requires-auth>
  <div class="wrap wrap-lg">

    <div class="crumb"><a href="/forum.html">Forum</a> › <span id="catName">…</span></div>

    <div class="page-head head-split">
      <div>
        <h1 class="page-title" id="pageTitle">…</h1>
        <p class="page-sub" id="pageDesc"></p>
      </div>
      <a href="#" class="btn btn-primary btn-sm" id="newBtn">New thread</a>
    </div>

    <div class="card">
      <div id="threadList"><div class="loading"><span class="spin" aria-hidden="true"></span>Loading threads…</div></div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap wrap-lg foot">
    <div class="spread">
      <span>© 2026 Dungeon</span>
      <nav id="footNav">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/guides.html">Guides</a>
        <a href="/forum.html">Forum</a>
        <a href="/support.html">Support</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/dungeon-nav.js" defer></script>
<script>
  const catId = new URLSearchParams(window.location.search).get('cat');
  if (!catId) window.location.href = '/forum.html';

  let myProfile = null;

  (async function(){
    const d = await (window.dungeonMe || fetch('/api/member/me').then(r=>r.json()).catch(()=>({})));
    if(!d.authenticated){window.location.href='/login.html';return}
    myProfile = d.member?.profile;
    loadCategory();
    loadThreads();
  })();

  async function loadCategory(){
    const cats = await fetch('/api/forum/categories').then(r=>r.json()).catch(()=>[]);
    if(!Array.isArray(cats)) return;
    const cat = cats.find(c=>c.id===catId);
    if(!cat){window.location.href='/forum.html';return}

    document.title = 'Dungeon · ' + cat.name;
    document.getElementById('catName').textContent = cat.name;
    document.getElementById('pageTitle').textContent = cat.name;
    document.getElementById('pageDesc').textContent = cat.description||'';

    const btn = document.getElementById('newBtn');
    btn.href = '/new-thread.html?cat=' + encodeURIComponent(catId);
    // Restricted categories are the Dungeon Master's to post in.
    if(cat.restricted && myProfile && !['warden','admin'].includes(myProfile.tier)){
      btn.remove();
    }
  }

  async function loadThreads(){
    const threads = await fetch('/api/forum/categories/'+encodeURIComponent(catId)+'/threads').then(r=>r.json()).catch(()=>[]);
    const el = document.getElementById('threadList');
    if(!Array.isArray(threads) || !threads.length){
      el.innerHTML='<div class="empty">Nothing here yet. Be the first to post.</div>';
      return;
    }
    el.className = 'rows';
    el.innerHTML = threads.map(t=>`
      <a class="row-item thread" href="/thread.html?id=${encodeURIComponent(t.id)}">
        <div class="row-main">
          <div class="flags">
            ${t.pinned?'<span class="pill pill-info">Pinned</span>':''}
            ${t.locked?'<span class="pill pill-mute">Locked</span>':''}
          </div>
          <b>${esc(t.title)}</b>
          <em>@${esc(t.screen_name)} · ${timeAgo(t.created_at)}</em>
        </div>
        <span class="thread-end">
          <b>${t.reply_count}</b>
          <span>${t.reply_count===1?'reply':'replies'}</span>
          ${t.last_poster?`<em>last @${esc(t.last_poster)}</em>`:''}
        </span>
      </a>`).join('');
  }

  function timeAgo(dt){
    if(!dt) return '';
    if(!dt.endsWith('Z') && !dt.includes('+')) dt = dt.replace(' ','T') + 'Z';
    const s=Math.floor((Date.now()-new Date(dt))/1000);
    if(s<60)return 'just now';
    if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago';
    if(s<604800)return Math.floor(s/86400)+'d ago';
    return new Date(dt).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }

  // Thread titles and usernames are member-supplied.
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
<script src="/notif-bell.js"></script>
</body>
</html>
