services:
  - type: web
    name: gridio
    runtime: node
    plan: starter # SQLite needs a persistent disk, which requires a paid plan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    disk:
      name: gridio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: INVITE_CODE
        sync: false # set in the Render dashboard
      - key: SEASON
        value: "2026"
      - key: WEEK1_MONDAY
        value: 2026-09-07T07:00:00Z
